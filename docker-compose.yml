# Local Postgres for development and tests — not used by any deploy.
# Matches the credentials in .env.development and the CI service.
#
#   npm run db:up      # start and wait until it accepts connections
#   npm run db:down    # stop (data is kept in the named volume)

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main_sv_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty volume: creates the throwaway test database.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
