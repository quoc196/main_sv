# Two long-lived environments, one blueprint.
#   branch staging -> main-sv-staging (NODE_ENV=staging)
#   branch main    -> main-sv         (NODE_ENV=production)
#
# Render reads this file from the branch the Blueprint is linked to (main).
# Editing it on `staging` alone has no effect until the change lands on main.
#
# PORT is injected by Render and must not be declared here: dotenv never
# overrides real process env, so Render's value wins over the .env.* files.

services:
  # ----------------------------------------------------------------- staging
  - type: web
    name: main-sv-staging
    runtime: node
    plan: free
    region: singapore
    branch: staging
    # Deploy only after GitHub checks (the CI job) pass on the commit, so a red
    # build never reaches this service.
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run db:migrate && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: staging
      - key: NODE_VERSION
        value: 22.22.2
      - key: APP_NAME
        value: main-sv-staging
      - key: HOST
        value: 0.0.0.0
      - key: API_PREFIX
        value: /api/v1
      - key: LOG_LEVEL
        value: debug
      - key: LOG_PRETTY
        value: "false"
      # Wildcard is tolerated here: credentialed requests are refused against a
      # wildcard, so there are no cookies to steal. Narrow it once a staging
      # frontend exists.
      - key: CORS_ORIGINS
        value: "*"
      # Neon/Supabase: use the POOLED string here (hostname with -pooler) and
      # the direct one for DATABASE_URL_UNPOOLED, which migrations need — a
      # transaction-mode pooler cannot hold their advisory lock. Plain Postgres
      # with no pooler in front: set DATABASE_URL only.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: DB_POOL_MAX
        value: "5"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "300"
      - key: SHUTDOWN_TIMEOUT_MS
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d

  # -------------------------------------------------------------- production
  - type: web
    name: main-sv
    runtime: node
    plan: free
    region: singapore
    branch: main
    # Deploy only after GitHub checks (the CI job) pass on the commit, so a red
    # build never reaches this service.
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run db:migrate && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.2
      - key: APP_NAME
        value: main-sv
      - key: HOST
        value: 0.0.0.0
      - key: API_PREFIX
        value: /api/v1
      - key: LOG_LEVEL
        value: info
      - key: LOG_PRETTY
        value: "false"
      # Set in the Render dashboard, comma-separated (e.g.
      # https://example.com,https://www.example.com). The app refuses to boot
      # with "*" when NODE_ENV=production, so this must not be committed here.
      - key: CORS_ORIGINS
        sync: false
      # Neon/Supabase: use the POOLED string here (hostname with -pooler) and
      # the direct one for DATABASE_URL_UNPOOLED, which migrations need — a
      # transaction-mode pooler cannot hold their advisory lock. Plain Postgres
      # with no pooler in front: set DATABASE_URL only.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: DB_POOL_MAX
        value: "5"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "100"
      - key: SHUTDOWN_TIMEOUT_MS
        value: "15000"
      # Generated once, per service — staging and production never share it.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
